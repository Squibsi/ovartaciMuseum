<!doctype html>
<html lang="da">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inria+Sans:ital,wght@0,300;0,400;0,700;1,300;1,400;1,700&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Nunito+Sans:ital,opsz,wght@0,6..12,200..1000;1,6..12,200..1000&display=swap"
      rel="stylesheet"
    />
    <!--Fan icon-->
    <link rel="icon" href="../img/fan-icon.png" type="img/icon" />
    <link rel="stylesheet" href="phone-css/phone-style.css" />
    <title>Museum Ovartaci</title>
  </head>

  <body>
    <div class="phone">
      <!-- Logoget i den hvide header -->
      <header>
        <img src="../img/header-logo.png" alt="Ovartaci logo" />
        <p>ART AND MIND - KUNST OG PSYKIATRI</p>
      </header>

      <!-- Indsætter den røde bjælke under header -->
      <nav></nav>

      <section class="start-content">
        <!-- Overskrift -->
        <h1>
          Velkommen til <br />
          Museum Ovartaci
        </h1>

        <!-- Knapper -->
        <section class="content">
          <button id="helpBtn">Hjælp mig i gang</button>
          <a id="tried-before-btn" href="phone-scanner.html"
            >Jeg har prøvet før</a
          >
        </section>
      </section>
    </div>
    <div class="onboarding">
      <h2 id="instructionText">Indsæt instruktioner</h2>
      <div class="image-wrapper">
        <img id="instructionImg" src="" alt="Instruction image" />
        <div id="cornerEffect">
          <span class="corner top-left"></span>
          <span class="corner top-right"></span>
          <span class="corner bottom-left"></span>
          <span class="corner bottom-right"></span>
        </div>
        <img id="instructionOverlay" src="" alt="Overlay image" />
      </div>

      <div class="progress-dots">
        <span class="dot active"></span>
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
      </div>

      <button id="nextBtn">Næste</button>
    </div>

    <script src="phone-js/phonescript.js"></script>
  </body>
</html>
