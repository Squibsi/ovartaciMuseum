<!doctype html>
<html lang="da">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Nunito+Sans:ital,opsz,wght@0,6..12,200..1000;1,6..12,200..1000&display=swap"
      rel="stylesheet"
    >
    <!--Fan icon-->
    <link rel="icon" href="../img/fan-icon.png" type="img/icon">
    <link rel="stylesheet" href="../tablet/tablet-css/collage3-style.css">
    <title>Normalitet | Museum Ovartaci</title>
  </head>
  <body>
    <!-- baggrundsbillede-->
    <div class="backgroundContainer">
      <img
        class="backgroundImage"
        src="../img/background-wheels.png"
        alt="baggrundsbillede"
      >
    </div>
    <!-- Header med logo og navigation -->
    <header class="navigationHeader">
      <div class="leftPlaceholder"></div>
      <!-- tom venstre side -->
      <div class="logo">
        <img
          src="../img/header-logo.png"
          alt="Museum Ovartaci logo"
          class="logoImg"
        >
      </div>
      <div class="rightArea">
        <img src="../img/house.svg" alt="Hjem" class="navIcon" id="homeIcon">
      </div>
    </header>
    <div class="redLine"></div>
    <main class="main">
      <h1>Vi arbejder på sagen!</h1>
      <p class="text">
        Denne brik er desværre ikke aktiv endnu. Projekt “Drøm med Ovartaci” er
        et eksperiment for at få flere interaktive oplevelser på Ovartaci
        Museet. Vi sætter pris på din tålmodighed og feedback.
      </p>

      <!-- billede område-->
      <div class="imageContainer">
        <img
          class="figure"
          src="../img/collage2figur4.png"
          alt="kvinde med værktøj"
        >
      </div>

      <button id="understoodBtn" class="Btnunderstood">Ok</button>
    </main>

    <script src="../tablet/js-tablet/collage3-script.js"></script>
  </body>
</html>
